                        className="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition-colors"
                      >
                        Отмена
                      </button>
                    </div>
                  </div>
                </div>

                  <div className="flex items-center justify-center py-8">
                    <Icon name="loader" className="w-6 h-6 animate-spin text-purple-400" />
                  </div>
                ) : tags.length === 0 ? (
                  <div className="text-center py-8">
                    <div className="text-4xl mb-2">🏷️</div>
                    <p className="text-gray-400">У вас пока нет тегов</p>
                    <p className="text-sm text-gray-500 mt-1">Создайте первый тег для организации игр</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {tags.map(tag => (
                      <div
                        key={tag.id}
                        className="flex items-center justify-between p-3 bg-gray-800/50 rounded-lg border border-gray-700"
                      >
                        <div className="flex items-center gap-3">
                          <div
                            className="w-4 h-4 rounded-full"
                            style={{ backgroundColor: tag.color }}
                          />
                          <span className="text-white font-medium">{tag.name}</span>
                        </div>
                        <button
                          onClick={() => deleteTag(tag.id)}
                          disabled={deletingTag === tag.id}
                          className="p-1 text-red-400 hover:text-red-300 hover:bg-red-500/20 rounded transition-colors disabled:opacity-50"
                        >
                          {deletingTag === tag.id ? (
                            <Icon name="loader" className="w-4 h-4 animate-spin" />
                          ) : (
                            <Icon name="trash" className="w-4 h-4" />
                          )}
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };


    // Компонент модального окна для добавления тегов к игре
    const TagModal = ({ game, token, onTagAdded, isOpen, onClose }) => {
      const [tags, setTags] = useState([]);

          const response = await fetch(`${API_URL}/api/tags?type=game`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          console.log('Tags response status:', response.status);
          if (response.ok) {
            const data = await response.json();
            console.log('Tags data:', data);
            setTags(data.tags || []);
          } else {
            const errorData = await response.json().catch(() => ({}));
            console.error('Error loading tags:', response.status, errorData);
            setTags([]);
          }
        } catch (error) {
          console.error('Ошибка загрузки тегов:', error);
          // Fallback: показываем пустой список тегов
          setTags([]);
        } finally {
          setLoading(false);
        }
      }, [token]);

      // Добавление тега к игре
      const addTagToGame = async (tagId) => {
        setAddingTag(tagId);
        try {
          const response = await fetch(`${API_URL}/api/games/${game.id}/tags/${tagId}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (response.ok) {
            onClose();
            if (onTagAdded) onTagAdded();
          }
        } catch (error) {
          console.error('Ошибка добавления тега:', error);
        } finally {
          setAddingTag(null);
        }
      };

      // Создание нового тега
      const createTag = async () => {
        if (!newTagName.trim()) return;
        
        setIsCreating(true);
        try {
          const response = await fetch(`${API_URL}/api/tags`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ name: newTagName.trim(), color: newTagColor, type: 'game' })
          });
          
          if (response.ok) {
            const data = await response.json();
            setTags(prev => [...prev, data.tag]);
            setNewTagName('');
            setNewTagColor('#3B82F6');
            setShowCreateForm(false);
            // Автоматически добавляем новый тег к игре
            await addTagToGame(data.tag.id);
          } else {
            throw new Error('Ошибка создания тега');
          }
        } catch (error) {
          console.error('Ошибка создания тега:', error);
        } finally {
          setIsCreating(false);
        }
      };

      useEffect(() => {
        if (isOpen) {
          loadTags();
        }
      }, [isOpen, loadTags]);

      // Фильтрация тегов (исключаем уже прикрепленные)
      const availableTags = tags.filter(tag => 
        !game.tags || !game.tags.some(gameTag => gameTag.id === tag.id)
      );

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] p-4" onClick={onClose}>
          <div className="bg-gray-900 rounded-2xl p-6 w-full max-w-md border border-purple-500/30 max-h-[80vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-xl font-bold text-white">Управление тегами</h2>
              <button onClick={onClose} className="p-2 hover:bg-gray-800 rounded-lg">
                <Icon name="x" className="w-5 h-5 text-gray-400" />
              </button>
            </div>
            
            <div className="mb-4">
              <p className="text-gray-400 text-sm">Игра: {game.name}</p>
            </div>

            {!showCreateForm ? (
              <div className="space-y-4">
                {/* Существующие теги */}
                {availableTags.length > 0 && (
                  <div>
                    <p className="text-gray-400 text-sm mb-2">Выберите существующий тег:</p>
                    <div className="space-y-2 max-h-40 overflow-y-auto">
                      {availableTags.map(tag => (
                        <button
                          key={tag.id}
                          onClick={() => addTagToGame(tag.id)}
                          disabled={addingTag === tag.id}
                          className="w-full px-4 py-3 text-left text-white hover:bg-gray-800 rounded-lg border border-gray-700 transition-colors flex items-center gap-3 disabled:opacity-50"
                        >
                          <div
                            className="w-4 h-4 rounded-full flex-shrink-0"
                            style={{ backgroundColor: tag.color }}
                          />
                          <span className="text-sm font-medium">{tag.name}</span>
                          {addingTag === tag.id && (
                            <Icon name="loader" className="w-4 h-4 animate-spin ml-auto text-purple-400" />
                          )}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* Кнопка создания нового тега */}
                <div className="border-t border-gray-700 pt-4">
                  <button
                    onClick={() => setShowCreateForm(true)}
                    className="w-full py-2 bg-purple-500 hover:bg-purple-600 text-white rounded-lg transition-colors flex items-center justify-center gap-2"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                    Создать новый тег
                  </button>
                </div>

                {availableTags.length === 0 && (
                  <div className="text-center py-8">
                    <div className="text-4xl mb-2">🏷️</div>
                    <p className="text-gray-400">Нет доступных тегов</p>
                    <p className="text-sm text-gray-500 mt-1">Создайте новый тег</p>
                  </div>
                )}
              </div>
            ) : (
              /* Форма создания нового тега */
              <div className="space-y-4">
                <div>
                  <label className="text-gray-400 text-sm">Название тега:</label>
                  <input
                    type="text"
                    value={newTagName}
                    onChange={(e) => setNewTagName(e.target.value)}
                    placeholder="Введите название тега"
                    className="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:border-purple-500 focus:outline-none text-white mt-1"
                    maxLength={50}
                  />
                </div>
                
                <div>
                  <label className="text-gray-400 text-sm">Цвет тега:</label>
                  <div className="flex flex-wrap gap-2 mt-2">
                    {predefinedColors.map(color => (
                      <button
                        key={color}
                        onClick={() => setNewTagColor(color)}
                        className={`w-8 h-8 rounded-full border-2 transition-all ${
                          newTagColor === color ? 'border-white scale-110' : 'border-gray-600'
                        }`}
                        style={{ backgroundColor: color }}
                      />
                    ))}
                  </div>
                </div>
                
                <div className="flex gap-2">
                  <button
                    onClick={createTag}
                    disabled={!newTagName.trim() || isCreating}
                    className="flex-1 py-2 bg-purple-500 hover:bg-purple-600 disabled:bg-gray-600 disabled:cursor-not-allowed text-white rounded-lg transition-colors"
                  >
                    {isCreating ? 'Создание...' : 'Создать тег'}
                  </button>
                  <button
                    onClick={() => {
                      setShowCreateForm(false);
                      setNewTagName('');
                      setNewTagColor('#3B82F6');
                    }}
                    className="flex-1 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition-colors"
                  >
                    Отмена
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Компонент истории изменений
    const HistoryLog = ({ isOpen, onClose, gameId, gameName, token }) => {
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(false);

      // Загрузка истории
      const loadHistory = useCallback(async () => {
        if (!token || !gameId) return;
        setLoading(true);
        try {
          const response = await fetch(`${API_URL}/api/user/history/game/${gameId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (response.ok) {
            const data = await response.json();
            setHistory(data.history || []);
          }
        } catch (error) {
          console.error('Ошибка загрузки истории:', error);
        } finally {
          setLoading(false);
        }
      }, [token, gameId]);

      // Форматирование относительной даты
      const formatRelativeDate = (dateString) => {
        const date = new Date(dateString);
        const now = new Date();
        const diffMs = now - date;
        const diffMinutes = Math.floor(diffMs / (1000 * 60));
        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

        if (diffMinutes < 1) return 'только что';
        if (diffMinutes < 60) return `${diffMinutes} мин назад`;
        if (diffHours < 24) return `${diffHours} ч назад`;
        if (diffDays === 1) return 'вчера';
        if (diffDays < 7) return `${diffDays} дн назад`;
        if (diffDays < 30) return `${Math.floor(diffDays / 7)} нед назад`;
        if (diffDays < 365) return `${Math.floor(diffDays / 30)} мес назад`;
        return `${Math.floor(diffDays / 365)} г назад`;
      };

      // Получение иконки для действия
      const getActionIcon = (action) => {
        switch (action) {
          case 'created': return '➕';
          case 'moved': return '🔄';
          case 'updated': return '✏️';
          case 'deleted': return '❌';
          default: return '📝';
        }
      };

      // Получение цвета для действия
      const getActionColor = (action) => {
        switch (action) {
          case 'created': return 'text-green-400';
          case 'moved': return 'text-blue-400';
          case 'updated': return 'text-yellow-400';
          case 'deleted': return 'text-red-400';
          default: return 'text-gray-400';
        }
      };

      // Форматирование изменений
      const formatChange = (action, oldValue, newValue) => {
        switch (action) {
          case 'created':
            return `Создано: ${newValue}`;
          case 'moved':
            return `Перемещено: ${oldValue} → ${newValue}`;
          case 'updated':
            return `Изменено: ${oldValue} → ${newValue}`;
          case 'deleted':
            return `Удалено: ${oldValue}`;
          default:
            return `${oldValue} → ${newValue}`;
        }
      };

      useEffect(() => {
        if (isOpen) {
          loadHistory();
        }
      }, [isOpen, loadHistory]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-gray-900 rounded-xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            {/* Header */}
            <div className="flex items-center justify-between p-6 border-b border-gray-700">
              <div>
                <h2 className="text-2xl font-bold text-white">📜 История изменений</h2>
                <p className="text-gray-400 text-sm mt-1">{gameName}</p>
              </div>
              <button
                onClick={onClose}
                className="p-2 hover:bg-gray-800 rounded-lg transition-colors"
              >
                <Icon name="x" className="w-6 h-6 text-gray-400" />
              </button>
            </div>

            {/* Content */}
            <div className="flex-1 overflow-y-auto p-6">
              {loading ? (
                <div className="flex items-center justify-center py-8">
                  <Icon name="loader" className="w-6 h-6 animate-spin text-purple-400" />
                  <span className="ml-2 text-gray-400">Загрузка истории...</span>
                </div>
              ) : history.length === 0 ? (
                <div className="text-center py-8">
                  <div className="text-4xl mb-2">📜</div>
                  <p className="text-gray-400">История изменений пуста</p>
                  <p className="text-sm text-gray-500 mt-1">Изменения появятся здесь после редактирования</p>
                </div>
              ) : (
                <div className="space-y-4">
                  {history.map((item, index) => (
                    <div key={item.id} className="flex items-start gap-4 p-4 bg-gray-800/50 rounded-lg border border-gray-700">
                      {/* Timeline line */}
                      <div className="flex flex-col items-center">
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${getActionColor(item.action)}`}>
                          {getActionIcon(item.action)}
                        </div>
                        {index < history.length - 1 && (
                          <div className="w-0.5 h-8 bg-gray-600 mt-2"></div>
                        )}
                      </div>

                      {/* Content */}
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 mb-1">
                          <span className={`text-sm font-medium ${getActionColor(item.action)}`}>
                            {formatChange(item.action, item.old_value, item.new_value)}
                          </span>
                        </div>
                        <p className="text-xs text-gray-400">
                          {formatRelativeDate(item.created_at)}
                        </p>
                        {item.old_value && item.new_value && item.action !== 'created' && item.action !== 'deleted' && (
                          <div className="mt-2 p-2 bg-gray-700/50 rounded text-xs">
                            <div className="text-red-400 line-through">{item.old_value}</div>
                            <div className="text-green-400">{item.new_value}</div>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Компонент модалки игры
    const GameModal = ({ game, onClose, onUpdate, onReact, isViewingFriend, user, token, onRemoveTag, onFilterByTag, onOpenTagModal }) => {
      const { touchOffset, isMobile, handleTouchStart, handleTouchMove, handleTouchEnd } = useSwipeToClose(onClose);
      const [removingTag, setRemovingTag] = useState(null);
      
      // Состояние для системы комментариев
      const [reviewText, setReviewText] = useState(game.review || '');
      const [isPublished, setIsPublished] = useState(game.is_published || false);
      const [isExpanded, setIsExpanded] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const [hoursPlayed, setHoursPlayed] = useState(game.hoursPlayed || 0);

      // Синхронизируем состояние с обновленной игрой
      useEffect(() => {
        setReviewText(game.review || '');
        setIsPublished(game.is_published || false);
        setHoursPlayed(game.hoursPlayed || 0);
      }, [game.review, game.is_published, game.hoursPlayed]);
      
      // Очищаем таймер при размонтировании компонента
      useEffect(() => {
        return () => {
          if (handleReviewChange.timeoutId) {
            clearTimeout(handleReviewChange.timeoutId);
          }
        };
      }, []);
      
      const handleRemoveTag = async (tagId, gameId) => {
        setRemovingTag(tagId);
        // Небольшая задержка для анимации
        setTimeout(() => {
          onRemoveTag(tagId, gameId);
          setRemovingTag(null);
        }, 300);
      };

      // Обработка изменения текста рецензии
      const handleReviewChange = useCallback((text) => {
        if (text.length <= 1000) {
          setReviewText(text);
          
          // Сохраняем черновик только если текст изменился и не пустой
          if (text !== (game.review || '') && text.length > 0) {
            // Очищаем предыдущий таймер
            if (handleReviewChange.timeoutId) {
              clearTimeout(handleReviewChange.timeoutId);
            }
            
            // Показываем индикатор сохранения
            setIsSaving(true);
            
            // Устанавливаем новый таймер
            handleReviewChange.timeoutId = setTimeout(async () => {
              try {
                await onUpdate(game.id, { 
                  review: text, 
                  is_published: false 
                });
                setIsPublished(false);
              } finally {
                setIsSaving(false);
              }
            }, 1000); // Задержка 1 секунда
          }
        }
      }, [game.review, game.id, onUpdate]);

      // Обработка изменения часов игры
      const handleHoursChange = useCallback(async (hours) => {
        const hoursNum = parseInt(hours) || 0;
        setHoursPlayed(hoursNum);
        
        // Сохраняем только если значение изменилось
        if (hoursNum !== (game.hoursPlayed || 0)) {
          try {
            await onUpdate(game.id, { 
              hoursPlayed: hoursNum
            });
          } catch (error) {
            console.error('Ошибка сохранения часов:', error);
          }
        }
      }, [game.hoursPlayed, game.id, onUpdate]);

      // Функция для получения параметров анимации в зависимости от часов
      const getWaveAnimation = (hours) => {
        const h = hours || 0;
        
        if (h === 0) {
          // Уровень 1: 0 часов - статичная линия
          return {
            dur: '999s', // Очень медленная, фактически статичная
            values: 'M 0 10 Q 100 10, 200 10 T 400 10',
            opacity: 0.2
          };
        } else if (h >= 1 && h <= 10) {
          // Уровень 2: 1-10 часов - легкая анимация
          return {
            dur: '4s',
            values: 'M 0 10 Q 100 8, 200 10 T 400 10;M 0 10 Q 100 12, 200 10 T 400 10;M 0 10 Q 100 8, 200 10 T 400 10',
            opacity: 0.3
          };
        } else if (h >= 11 && h <= 20) {
          // Уровень 3: 11-20 часов
          return {
            dur: '3.5s',
            values: 'M 0 10 Q 100 7, 200 10 T 400 10;M 0 10 Q 100 13, 200 10 T 400 10;M 0 10 Q 100 7, 200 10 T 400 10',
            opacity: 0.35
          };
        } else if (h >= 21 && h <= 30) {
          // Уровень 4: 21-30 часов
          return {
            dur: '3s',
            values: 'M 0 10 Q 100 6, 200 10 T 400 10;M 0 10 Q 100 14, 200 10 T 400 10;M 0 10 Q 100 6, 200 10 T 400 10',
            opacity: 0.4
          };
        } else if (h >= 31 && h <= 40) {
          // Уровень 5: 31-40 часов
          return {
            dur: '2.5s',
            values: 'M 0 10 Q 100 5, 200 10 T 400 10;M 0 10 Q 100 15, 200 10 T 400 10;M 0 10 Q 100 5, 200 10 T 400 10',
            opacity: 0.45
          };
        } else if (h >= 41 && h <= 50) {
          // Уровень 6: 41-50 часов
          return {
            dur: '2s',
            values: 'M 0 10 Q 100 4, 200 10 Q 300 4, 400 10;M 0 10 Q 100 16, 200 10 Q 300 16, 400 10;M 0 10 Q 100 4, 200 10 Q 300 4, 400 10',
            opacity: 0.5
          };
        } else if (h >= 51 && h <= 60) {
          // Уровень 7: 51-60 часов
          return {
            dur: '1.8s',
            values: 'M 0 10 Q 100 3, 200 10 Q 300 3, 400 10;M 0 10 Q 100 17, 200 10 Q 300 17, 400 10;M 0 10 Q 100 3, 200 10 Q 300 3, 400 10',
            opacity: 0.55
          };
        } else if (h >= 61 && h <= 70) {
          // Уровень 8: 61-70 часов
          return {
            dur: '1.5s',
            values: 'M 0 10 Q 50 3, 100 10 Q 150 17, 200 10 Q 250 3, 300 10 Q 350 17, 400 10;M 0 10 Q 50 17, 100 10 Q 150 3, 200 10 Q 250 17, 300 10 Q 350 3, 400 10;M 0 10 Q 50 3, 100 10 Q 150 17, 200 10 Q 250 3, 300 10 Q 350 17, 400 10',
            opacity: 0.6
          };
        } else if (h >= 71 && h <= 80) {
          // Уровень 9: 71-80 часов
          return {
            dur: '1.2s',
            values: 'M 0 10 Q 50 2, 100 10 Q 150 18, 200 10 Q 250 2, 300 10 Q 350 18, 400 10;M 0 10 Q 50 18, 100 10 Q 150 2, 200 10 Q 250 18, 300 10 Q 350 2, 400 10;M 0 10 Q 50 2, 100 10 Q 150 18, 200 10 Q 250 2, 300 10 Q 350 18, 400 10',
            opacity: 0.65
          };
        } else if (h >= 81 && h <= 90) {
          // Уровень 10: 81-90 часов
          return {
            dur: '1s',
            values: 'M 0 10 Q 33 1, 66 10 Q 100 19, 133 10 Q 166 1, 200 10 Q 233 19, 266 10 Q 300 1, 333 10 Q 366 19, 400 10;M 0 10 Q 33 19, 66 10 Q 100 1, 133 10 Q 166 19, 200 10 Q 233 1, 266 10 Q 300 19, 333 10 Q 366 1, 400 10;M 0 10 Q 33 1, 66 10 Q 100 19, 133 10 Q 166 1, 200 10 Q 233 19, 266 10 Q 300 1, 333 10 Q 366 19, 400 10',
            opacity: 0.7
          };
        } else {
          // Уровень 11: 91-100+ часов - максимальная анимация с закручиванием
          return {
            dur: '0.6s',
            values: 'M 0 10 Q 20 -5, 40 10 Q 60 25, 80 10 Q 100 -5, 120 10 Q 140 25, 160 10 Q 180 -5, 200 10 Q 220 25, 240 10 Q 260 -5, 280 10 Q 300 25, 320 10 Q 340 -5, 360 10 Q 380 25, 400 10;M 0 10 Q 20 25, 40 10 Q 60 -5, 80 10 Q 100 25, 120 10 Q 140 -5, 160 10 Q 180 25, 200 10 Q 220 -5, 240 10 Q 260 25, 280 10 Q 300 -5, 320 10 Q 340 25, 360 10 Q 380 -5, 400 10;M 0 10 Q 20 -5, 40 10 Q 60 25, 80 10 Q 100 -5, 120 10 Q 140 25, 160 10 Q 180 -5, 200 10 Q 220 25, 240 10 Q 260 -5, 280 10 Q 300 25, 320 10 Q 340 -5, 360 10 Q 380 25, 400 10',
            opacity: 0.85
          };
        }
      };

      const currentHours = isViewingFriend ? (game.hoursPlayed || 0) : (hoursPlayed || 0);
      const waveAnim = getWaveAnimation(currentHours);

      // Публикация рецензии
      const publishReview = useCallback(() => {
        const updateData = { 
          review: reviewText, 
          is_published: true
        };
        console.log('Publishing game review with data:', updateData);
        onUpdate(game.id, updateData);
        setIsPublished(true);
      }, [reviewText, game.id, onUpdate]);

      // Показать подтверждение удаления
      const showDeleteConfirmation = useCallback(() => {
        setShowDeleteConfirm(true);
      }, []);

      // Удаление отзыва
      const deleteReview = useCallback(async () => {
        try {
          const response = await fetch(`${API_URL}/api/games/${game.id}/review`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          });
          
          if (response.ok) {
            // Обновляем локальное состояние
            setReviewText('');
            setIsPublished(false);
            onUpdate(game.id, { review: null, is_published: false });
            setShowDeleteConfirm(false);
            alert('Отзыв успешно удален');
          } else {
            throw new Error('Failed to delete review');
          }
        } catch (error) {
          console.error('Ошибка удаления отзыва:', error);
          alert('Не удалось удалить отзыв. Попробуйте еще раз.');
        }
      }, [game.id, token, onUpdate]);

      // Отмена удаления
      const cancelDelete = useCallback(() => {
        setShowDeleteConfirm(false);
      }, []);
      
      return (
        <>
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] md:p-4" onClick={onClose}>
          <div 
            className={`bg-gray-900 rounded-2xl p-6 w-full max-w-md border border-purple-500/30 max-h-[90vh] overflow-y-auto elevation-3 ${isMobile ? 'mobile-fullscreen-modal' : ''}`}
            style={isMobile ? { transform: `translateY(${touchOffset}px)`, transition: touchOffset === 0 ? 'transform 0.3s ease' : 'none' } : {}}
            onClick={e => e.stopPropagation()}
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
          >
            {isMobile && <div className="swipe-indicator"></div>}
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold text-white">{game.name}</h2>
              <button onClick={onClose} className="p-2 hover:bg-gray-800 rounded-lg">
                <Icon name="x" className="w-5 h-5 text-gray-400" />
              </button>
            </div>
            <div className="space-y-4">
              {!isViewingFriend ? (
                <Fragment>
                  <div>
                    <p className="text-gray-400 text-sm mb-2">Рейтинг:</p>
                    <div className="flex gap-2">
                      {[1, 2, 3, 4, 5].map(star => (
                        <button 
                          key={star} 
                          onClick={() => onUpdate(game.id, { rating: star })} 
                          className="transition-all duration-200 hover:scale-110 active:scale-95"
                        >
                          <Icon 
                            name="star" 
                            className={`w-8 h-8 transition-all duration-300 ${
                              star <= (game.rating || 0) 
                                ? 'text-yellow-400 drop-shadow-lg' 
                                : 'text-gray-600 hover:text-gray-400'
                            }`} 
                          />
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="text-gray-400 text-sm">Отзыв:</label>
                    <textarea 
                      value={reviewText} 
                      onChange={(e) => handleReviewChange(e.target.value)}
                      className="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:border-purple-500 focus:outline-none text-white mt-1" 
                      rows="4" 
                      placeholder="Ваши впечатления..."
                      maxLength="1000"
                    />
                    {/* Счетчик символов */}
                    <div className="flex justify-between items-center mt-1">
                      <div className="text-xs text-gray-500">
                        {reviewText.length}/1000 символов
                      </div>
                      {reviewText.length > 800 && (
                        <div className="text-xs text-yellow-400">
                          Осталось {1000 - reviewText.length} символов
                        </div>

          const handleMouseUp = async (e) => {
            setIsDragging(false);
            
            // Проверяем, над каким слотом был отпущен курсор
            const slots = document.querySelectorAll('[data-slot-index]');
            let droppedOnSlot = null;
            
            slots.forEach(slot => {
              const rect = slot.getBoundingClientRect();
              if (e.clientX >= rect.left && e.clientX <= rect.right &&
                  e.clientY >= rect.top && e.clientY <= rect.bottom) {
                droppedOnSlot = parseInt(slot.getAttribute('data-slot-index'));
              }

              setPlacingMode(false);
              setStickerToPlace(null);
              setStickerPosition({ x: 400, y: 300 });
            }
            
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);
          };
          
          document.addEventListener('mousemove', handleMouseMove);
          document.addEventListener('mouseup', handleMouseUp);
          
          return () => {
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);

              const deltaX = e.clientX - dragStart.x;
              const deltaY = e.clientY - dragStart.y;
              setStickerPosition(prev => ({
                x: Math.max(50, Math.min(window.innerWidth - 200, prev.x + deltaX)),
                y: Math.max(50, Math.min(window.innerHeight - 200, prev.y + deltaY))
              }));
              setDragStart({ x: e.clientX, y: e.clientY });
            } else if (isResizing) {
              const deltaX = e.clientX - dragStart.x;
              const delta = deltaX * 0.01; // Коэффициент для изменения размера
              const newScale = Math.max(0.33, Math.min(3.0, stickerScale + delta));
              setStickerScale(newScale);
              setDragStart({ x: e.clientX, y: e.clientY });
            } else if (isRotating) {
              const centerX = stickerPosition.x;
              const centerY = stickerPosition.y;
              const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);

              setStickerRotation(Math.round(normalizedAngle));
            }
          };
          
          const handleMouseUp = () => {
            setIsDragging(false);
            setIsResizing(false);
            setIsRotating(false);

          document.addEventListener('mouseup', handleMouseUp);

            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);

            setEditingStickerScale(newScale);

      const debounce = (func, wait) => {
        let timeout;
        return function executedFunction(...args) {
          const later = () => {
            clearTimeout(timeout);
            func(...args);
          };
          clearTimeout(timeout);
          timeout = setTimeout(later, wait);
        };
      };

      const handleDrop = (e, targetBoardId, targetIndex) => {
        e.preventDefault();
        e.stopPropagation();
        console.log('Drop:', targetBoardId, targetIndex, dragItem.current);

        if (!dragItem.current) return;
        const { card: draggedCard, sourceBoardId, sourceIndex } = dragItem.current;
        if (sourceBoardId === targetBoardId && sourceIndex === targetIndex) return;

        // Оптимистичное обновление UI
        setBoards(prevBoards => {
            const newBoards = JSON.parse(JSON.stringify(prevBoards));
            const [movedItem] = newBoards[sourceBoardId].cards.splice(sourceIndex, 1);
            if (targetIndex === undefined) {
                newBoards[targetBoardId].cards.push(movedItem);
            } else {
                newBoards[targetBoardId].cards.splice(targetIndex, 0, movedItem);
            }
            return newBoards;
        });
        
        if (sourceBoardId !== targetBoardId) {
            updateGame(draggedCard.id, { board: targetBoardId });
        } else {
            const orderedIds = boards[targetBoardId].cards.map(c => c.id);
            updateBoardOrder(targetBoardId, orderedIds);

      const handleResendVerificationEmail = async () => {
          if (!user?.email) {
              showToast('Email не найден', 'error');
              return;
          }
          
          // Проверяем, не идет ли уже отправка
          if (resendingEmail) {
              return;
          }
          
          setResendingEmail(true);
          try {
              // Добавляем таймаут для запроса (30 секунд)
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 30000);
              
              const response = await fetch(`${API_URL}/api/auth/resend-verification`, {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ email: user.email }),
                  signal: controller.signal
              });
              
              clearTimeout(timeoutId);
              
              // Проверяем, является ли ответ JSON
              const contentType = response.headers.get('content-type');
              let data;
              
              if (contentType && contentType.includes('application/json')) {
                  data = await response.json();
              } else {
                  const text = await response.text();
                  console.error('Неожиданный формат ответа:', text);
                  throw new Error('Сервер вернул неожиданный формат ответа');
              }
              
              if (response.ok) {
                  showToast('Письмо подтверждения отправлено на ваш email', 'success');
              } else {
                  showToast(data.error || 'Ошибка отправки письма', 'error');
              }
          } catch (error) {
              console.error('Ошибка отправки письма подтверждения:', error);
              
              if (error.name === 'AbortError') {
                  showToast('Превышено время ожидания ответа от сервера', 'error');
              } else if (error.message.includes('Failed to fetch')) {
                  showToast('Ошибка подключения к серверу. Проверьте интернет-соединение', 'error');
              } else {
                  showToast('Ошибка отправки письма: ' + (error.message || 'Неизвестная ошибка'), 'error');
              }
          } finally {

    const DeepReviewModal = ({ game, existingAnswers, onClose, onSubmit }) => {

            return initial;
        });
        const [currentStep, setCurrentStep] = useState(0);

        const handleAnswer = (qIndex, aIndex) => {

            setAnswers(newAnswers);
        };

        const allQuestionsFlat = DEEP_REVIEW_QUESTIONS.flatMap(b => b.questions);
        const currentQuestion = allQuestionsFlat[currentStep];

        const answeredCount = answers.filter(a => a !== null).length;
        const allAnswered = answeredCount === 20;

        return (

    const generateReviewText = (answers) => {
        if (!answers || answers.length < 20) return null;

        const allQuestions = DEEP_REVIEW_QUESTIONS.flatMap(b => b.questions);
        
        const getAnswer = (qId) => {
            const answerIndex = answers[qId - 1];
            if (answerIndex === null) return { text: '', sentiment: 0 };
            
            const text = allQuestions[qId - 1].answers[answerIndex];
            let sentiment = 0;
            if (answerIndex <= 2) sentiment = 1;
            else if (answerIndex >= 4) sentiment = -1;
            
            return { text, sentiment };

             p1 += ` Что касается персонажей, то выделить можно было лишь главного героя.`;

        } else {
            p3 += `При этом звук в игре был ${sound.text}. `;
        }
        
        if (tech.sentiment < 1) {
            p3 += `К сожалению, техническая сторона неидеальна: ${tech.text}.`;
        }
        paragraphs.push(p3);

        const difficulty = getAnswer(14);
        const recommendation = getAnswer(19);
        const summary = getAnswer(20);
        let p4 = `По сложности проект ${difficulty.text}. `;
        
        if (recommendation.sentiment > 0) {
            p4 += `Я бы посоветовал эту игру ${recommendation.text}. `;
        } else {
            p4 += `Советовать эту игру я бы не стал, разве что ${recommendation.text}. `;
        }
        p4 += `Подводя итог, для меня это ${summary.text}`;
        paragraphs.push(p4);

        return paragraphs.join('\n\n');
    };
    
    const DisplayDeepReview = ({ answers }) => {
        const [isExpanded, setIsExpanded] = useState(false);
        const reviewText = generateReviewText(answers);
        if (!reviewText) return null;

        const snippet = reviewText.substring(0, 200);

        return (
            <div className="mt-4 pt-4 border-t border-gray-700">
                <h4 className="text-lg font-semibold text-purple-300 mb-2">Детальный отзыв</h4>
                <p className="text-gray-300 whitespace-pre-wrap">
                    {isExpanded ? reviewText : `${snippet}...`}
                </p>
                {reviewText.length > 200 && (
                    <button onClick={() => setIsExpanded(!isExpanded)} className="text-purple-400 hover:text-purple-300 mt-2">
                        {isExpanded ? 'Свернуть' : 'Показать полностью'}
                    </button>
                )}
            </div>
        );
    };


    ReactDOM.render(<GameKanban />, document.getElementById('root'));
  </script>
</body>
</html>
