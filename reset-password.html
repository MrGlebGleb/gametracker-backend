<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля - GameTracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            text-align: center;
            animation: pulse 2s infinite;
        }
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #a855f7, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 1.1rem;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #d1d5db;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(75, 85, 99, 0.5);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }
        .form-group input::placeholder {
            color: #6b7280;
        }
        .password-container {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }
        .password-toggle:hover {
            color: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: rgba(75, 85, 99, 0.8);
            margin-top: 10px;
        }
        .btn-secondary:hover:not(:disabled) {
            background: rgba(75, 85, 99, 1);
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h1 class="title">GameTracker</h1>
        <p class="subtitle">Сброс пароля</p>
        
        <div id="alert-container"></div>
        
        <form id="reset-form">
            <div class="form-group">
                <label for="newPassword">Новый пароль:</label>
                <div class="password-container">
                    <input 
                        type="password" 
                        id="newPassword" 
                        name="newPassword" 
                        placeholder="Введите новый пароль" 
                        required 
                        minlength="6"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">👁️</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Подтвердите пароль:</label>
                <div class="password-container">
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Подтвердите новый пароль" 
                        required 
                        minlength="6"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</button>
                </div>
            </div>
            
            <button type="submit" class="btn" id="submit-btn">
                🔑 Сбросить пароль
            </button>
        </form>
        
        <button onclick="window.location.href='/'" class="btn btn-secondary">
            🏠 На главную
        </button>
    </div>

    <script>
        let isLoading = false;
        
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const button = field.nextElementSibling;
            
            if (field.type === 'password') {
                field.type = 'text';
                button.textContent = '🙈';
            } else {
                field.type = 'password';
                button.textContent = '👁️';
            }
        }
        
        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type}">
                    ${message}
                </div>
            `;
        }
        
        function setLoading(loading) {
            isLoading = loading;
            const submitBtn = document.getElementById('submit-btn');
            
            if (loading) {
                submitBtn.innerHTML = '<span class="spinner"></span>Сброс пароля...';
                submitBtn.disabled = true;
            } else {
                submitBtn.innerHTML = '🔑 Сбросить пароль';
                submitBtn.disabled = false;
            }
        }
        
        async function resetPassword(newPassword, confirmPassword) {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showAlert('Токен сброса пароля не найден в URL', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showAlert('Пароли не совпадают', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showAlert('Пароль должен содержать минимум 6 символов', 'error');
                return;
            }
            
            setLoading(true);
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAlert('✅ ' + data.message, 'success');
                    document.getElementById('reset-form').style.display = 'none';
                } else {
                    showAlert('❌ ' + (data.error || 'Ошибка сброса пароля'), 'error');
                }
            } catch (error) {
                showAlert('❌ Ошибка подключения к серверу', 'error');
            } finally {
                setLoading(false);
            }
        }
        
        document.getElementById('reset-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (isLoading) return;
            
            const formData = new FormData(this);
            const newPassword = formData.get('newPassword');
            const confirmPassword = formData.get('confirmPassword');
            
            resetPassword(newPassword, confirmPassword);
        });
        
        // Проверяем наличие токена при загрузке
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showAlert('❌ Токен сброса пароля не найден. Проверьте ссылку из email.', 'error');
                document.getElementById('reset-form').style.display = 'none';
            }
        });
    </script>
</body>
</html>
