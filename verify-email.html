<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение Email - GameTracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #a855f7, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .status {
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 500;
        }
        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        .loading {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }
        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📧</div>
        <h1 class="title">GameTracker</h1>
        <p class="subtitle">Подтверждение Email</p>
        
        <div id="status" class="status loading">
            <div class="spinner"></div>
            <div style="margin-top: 10px;">Проверяем токен...</div>
        </div>
        
        <div id="result" style="display: none;">
            <div id="result-content"></div>
            <a href="/" class="btn" id="home-btn" style="display: none;">🏠 На главную</a>
        </div>
    </div>

    <script>
        async function verifyEmail() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showError('Токен подтверждения не найден в URL');
                return;
            }
            
            try {
                const response = await fetch(`/api/auth/verify-email?token=${token}`);
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess(data.message);
                } else {
                    showError(data.error || 'Ошибка подтверждения email');
                }
            } catch (error) {
                showError('Ошибка подключения к серверу');
            }
        }
        
        function showSuccess(message) {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('result-content');
            const homeBtn = document.getElementById('home-btn');
            
            statusDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            
            resultContent.innerHTML = `
                <div class="status success">
                    ✅ ${message}
                </div>
            `;
            
            homeBtn.style.display = 'inline-block';
        }
        
        function showError(message) {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('result-content');
            const homeBtn = document.getElementById('home-btn');
            
            statusDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            
            resultContent.innerHTML = `
                <div class="status error">
                    ❌ ${message}
                </div>
            `;
            
            homeBtn.style.display = 'inline-block';
        }
        
        // Запускаем проверку при загрузке страницы
        window.addEventListener('load', verifyEmail);
    </script>
</body>
</html>
